<html lang="fr">
<head>

</header>
<input id="search" placeholder="Rechercher un jeu..." oninput="rechercher()">
<h2 style="text-align:center">MES 19 JEUX</h2>
<div id="games">
</div>
<footer>GAME PSP DOWNLOAD © 2026</footer>
<script>
const jeux=[
"GTA Vice City Stories",

"Naruto: Ultimate Ninja Heroes",

"eFootball 2024 PSP C19"
];
const zone=document.getElementById("games");
jeux.forEach(nom=>{

</html>
