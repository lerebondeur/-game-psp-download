
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME PSP DOWNLOAD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07110c;color:white;font-family:Arial}
header{text-align:center;background:#0b2819;padding:25px 10px;border-bottom:3px solid #20e879}
header h1{color:#20e879}
input{width:90%;margin:20px 5%;padding:14px;border-radius:10px;border:2px solid #20e879;background:#14251b;color:white;font-size:16px}
h2{text-align:center;color:#20e879}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.game{background:#13251a;border:1px solid #237c49;border-radius:12px;padding:10px;text-align:center}
.game img{width:100%;height:190px;object-fit:contain;border-radius:8px;background:#09140d}
.game h3{font-size:14px}
.game p{font-size:12px;color:#b5d9c1}
footer{text-align:center;padding:25px;color:#9dbba8}
</style>
</head>
<body>
<header>
<h1>🎮 GAME PSP DOWNLOAD</h1>
<p>Ton univers de jeux</p>
</header>

<input id="search" placeholder="🔎 Rechercher un jeu..." oninput="rechercher()">
<h2>TOUS LES JEUX</h2>
<div class="games" id="games"></div>

<footer>GAME PSP DOWNLOAD © 2026</footer>

<script>
const jeux = [
["GTA Vice City Stories","https://thumbnails.libretro.com/Sony%20-%20PlayStation%20Portable/Named_Boxarts/Grand%20Theft%20Auto%20-%20Vice%20City%20Stories%20(USA).png"],
["Call of Duty: Roads to Victory",""],
["Downhill Domination",""],
["Naruto Shippuden: Legends Akatsuki Rising",""],
["Army of Two: The 40th Day",""],
["God of War: Chains of Olympus","https://thumbnails.libretro.com/Sony%20-%20PlayStation%20Portable/Named_Boxarts/God%20of%20War%20-%20Chains%20of%20Olympus%20(USA).png"],
["Coded Arms: Contagion",""],
["eFootball 2025 NC PC-V",""],
["eFootball 2026 PSP Lop Play V1",""],
["Mortal Kombat: Unchained",""],
["Medal of Honor: Heroes",""],
["Tom Clancy's Ghost Recon",""],
["Naruto: Ultimate Ninja Heroes",""],
["GTA LCS by TDG",""],
["Naruto Shippuden: Ultimate Ninja Heroes",""],
["Naruto Shippuden: Ultimate Ninja Impact",""],
["FC 26 PSP Lop Play",""],
["eFootball 2026 No Texture by BeteGaming",""],
["eFootball 2024 PSP C19",""]
];

const conteneur=document.getElementById("games");

jeux.forEach(jeu=>{
 const carte=document.createElement("div");
 carte.className="game";
 const image=document.createElement("img");
 image.alt="Couverture de "+jeu[0];
 image.src=jeu[1] || "";
 image.onerror=()=>{image.removeAttribute("src");image.alt="🎮 Image à ajouter";image.style.display="none";};
 const titre=document.createElement("h3");
 titre.textContent=jeu[0];
 const info=document.createElement("p");
 info.textContent=jeu[1]?"Couverture disponible":"Couverture à ajouter";
 carte.append(image,titre,info);
 conteneur.appendChild(carte);
});

function rechercher(){
 const mot=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".game").forEach(carte=>{
 carte.style.display=carte.innerText.toLowerCase().includes(mot)?"block":"none";
 });
}
</script>
</body>
</html>
